<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>World Map AR (AR.js NFT) — Prefilled SG / China / Korea</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta http-equiv="Permissions-Policy" content="camera=(self)">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:;">
    <!-- A-Frame + AR.js (NFT build) -->
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar-nft.js"></script>
    <style>
      html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000; }
      .ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px;
            display: flex; justify-content: center; pointer-events: none;
            font-family: system-ui, Arial; color: white; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
      .hint { position: fixed; top: 10px; left: 0; right: 0; text-align: center; color: #fff; font-family: system-ui; }
    </style>
  </head>

  <button id="enableCam"
  style="position:fixed;inset:auto 16px 16px auto;padding:12px 16px;z-index:9999;
         border:0;border-radius:12px;background:#111;color:#fff;font:600 14px system-ui;">
  Enable Camera
  </button>
  <script>
    async function unlockCamera() {
      try {
        const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }});
        // immediately release; AR.js will acquire its own stream
        s.getTracks().forEach(t => t.stop());
      } catch (e) { console.warn(e); alert("Please allow camera in browser settings."); }
      document.getElementById('enableCam').style.display = 'none';
    }
    document.getElementById('enableCam').addEventListener('click', unlockCamera, { passive:true });
  </script>

  <body>
    <div class="hint">Point your camera at the printed Asia map. Tap regions or pins.</div>
    <img src="./worldmap.png" alt="Asia Map" width="600">

    <a-scene
      vr-mode-ui="enabled: false"
      renderer="precision: mediump; antialias: true;"
      embedded
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false; patternRatio: 0.9;"
    >
      <!-- Camera + cursor (for tapping) -->
      <a-entity camera position="0 0 0" look-controls="enabled: false">
        <a-entity id="cursor" cursor="rayOrigin: mouse"
                  raycaster="objects: .tappable; far: 100; interval: 0"></a-entity>
      </a-entity>

      <!-- NFT target: change url if your base name differs -->
      <a-nft
        type="nft"
        url="./nft"
        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5"
      >
        <!-- Reference plane (1.6 x 1.0) -->
        <a-entity id="mapRoot" position="0 0 0">
          <a-plane id="mapPlane" width="1.6" height="1.0" color="#FFF" material="opacity: 0.0; transparent: true"></a-plane>
        </a-entity>
      </a-nft>
    </a-scene>

    <script>
      // === Prefilled pins and regions ===
      const POINTS = [
        { label: "Singapore", lon: 103.8198, lat: 1.3521,  url: "https://www.visitsingapore.com/" },
        { label: "Beijing",   lon: 116.4074, lat: 39.9042, url: "https://en.wikipedia.org/wiki/Beijing" },
        { label: "Seoul",     lon: 126.9780, lat: 37.5665, url: "https://en.wikipedia.org/wiki/Seoul" }
      ];

      // Bounding boxes are approximate in lon/lat
      const REGIONS = [
        {
          name: "CHINA",
          lonMin: 73.5, lonMax: 134.8, latMin: 18.0, latMax: 53.6,
          url: "https://en.wikipedia.org/wiki/China",
          color: "#FFA500"
        },
        {
          name: "KOREA (Peninsula)",
          lonMin: 124.0, lonMax: 131.0, latMin: 33.0, latMax: 43.0,
          url: "https://en.wikipedia.org/wiki/Korean_Peninsula",
          color: "#FFD500"
        },
        {
          name: "SINGAPORE (Tiny)",
          lonMin: 103.6, lonMax: 104.1, latMin: 1.2, latMax: 1.5,
          url: "https://en.wikipedia.org/wiki/Singapore",
          color: "#DC143C"
        }
      ];

      // === Mapping helpers ===
      function mercatorY(latDeg) {
        const lat = (Math.max(Math.min(latDeg, 85), -85)) * Math.PI / 180;
        return Math.log(Math.tan(Math.PI/4 + lat/2));
      }
      function lonLatToXY(lon, lat) {
        const x01 = (lon + 180) / 360;                 // [0,1]
        const y01 = (1 - (mercatorY(lat) / Math.PI)) / 2; // [0,1]
        return { x: (x01 - 0.5) * 1.6, y: (0.5 - y01) * 1.0 };
      }

      function createPin(parent, x, y, label, url) {
        const pin = document.createElement("a-sphere");
        pin.setAttribute("class", "tappable");
        pin.setAttribute("radius", 0.012);
        pin.setAttribute("position", `${x} ${y} 0.01`);
        pin.setAttribute("metalness", 0.1);
        pin.setAttribute("roughness", 0.5);
        if (url) pin.dataset.url = url;
        parent.appendChild(pin);

        const labelPlane = document.createElement("a-plane");
        labelPlane.setAttribute("position", `${x} ${y + 0.065} 0.01`);
        labelPlane.setAttribute("width", 0.42);
        labelPlane.setAttribute("height", 0.11);
        labelPlane.setAttribute("material", "transparent: true;");
        const canvas = makeLabelTexture(label);
        const tex = new THREE.CanvasTexture(canvas);
        const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
        labelPlane.addEventListener("object3dset", () => {
          const mesh = labelPlane.getObject3D('mesh');
          if (mesh) mesh.material = mat;
        });
        parent.appendChild(labelPlane);
      }

      function makeLabelTexture(text) {
        const c = document.createElement("canvas");
        c.width = 640; c.height = 160;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "rgba(0,0,0,0.65)"; ctx.fillRect(0, 0, 640, 160);
        ctx.fillStyle = "#fff"; ctx.font = "64px system-ui, Arial, sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(text, 320, 80);
        return c;
      }

      function createRegion(parent, region) {
        const c1 = lonLatToXY(region.lonMin, region.latMin);
        const c2 = lonLatToXY(region.lonMax, region.latMax);
        const centerX = (c1.x + c2.x) / 2;
        const centerY = (c1.y + c2.y) / 2;
        const width = Math.abs(c2.x - c1.x);
        const height = Math.abs(c2.y - c1.y);

        const plane = document.createElement("a-plane");
        plane.setAttribute("class", "tappable");
        plane.setAttribute("position", `${centerX} ${centerY} 0.005`);
        plane.setAttribute("width", Math.max(0.02, width));
        plane.setAttribute("height", Math.max(0.02, height));
        const color = region.color || "#00FF88";
        plane.setAttribute("material", `color: ${color}; opacity: 0.25; transparent: true; side: double;`);
        if (region.url) plane.dataset.url = region.url;
        parent.appendChild(plane);

        const labelPlane = document.createElement("a-plane");
        labelPlane.setAttribute("position", `${centerX} ${centerY + (height/2) + 0.06} 0.006`);
        labelPlane.setAttribute("width", 0.72);
        labelPlane.setAttribute("height", 0.12);
        labelPlane.setAttribute("material", "transparent: true;");
        const canvas = makeLabelTexture(region.name);
        const tex = new THREE.CanvasTexture(canvas);
        const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
        labelPlane.addEventListener("object3dset", () => {
          const mesh = labelPlane.getObject3D('mesh');
          if (mesh) mesh.material = mat;
        });
        parent.appendChild(labelPlane);
      }

      async function init() {
        const mapRoot = document.querySelector("#mapRoot");

        // Draw regions first (so pins appear on top)
        REGIONS.forEach(r => createRegion(mapRoot, r));
        // Pins
        POINTS.forEach(p => {
          const {x, y} = lonLatToXY(p.lon, p.lat);
          createPin(mapRoot, x, y, p.label, p.url || null);
        });

        const cursor = document.querySelector("#cursor");
        cursor.addEventListener("click", (e) => {
          const el = e && e.detail && e.detail.intersectedEl;
          if (el && el.dataset && el.dataset.url) {
            window.open(el.dataset.url, "_blank");
          }
        });
      }

      init().catch(err => {
        console.error(err);
        alert("Failed to initialize: " + err.message);
      });
    </script>
  </body>
</html>

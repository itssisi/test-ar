<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <title>AR.js Map Stats (Vercel)</title>
  <meta http-equiv="Permissions-Policy" content="camera=*, microphone=()">
  <style>body,html{margin:0;padding:0;background:#000;overflow:hidden}
    #startAR{position:fixed;right:12px;bottom:12px;padding:10px 14px;border-radius:10px;border:none;background:#1e88e5;color:#fff;font:600 14px system-ui;z-index:10}
    .hint{position:fixed;left:12px;bottom:12px;color:#fff;font:14px/1.35 system-ui;background:rgba(0,0,0,.35);padding:8px 10px;border-radius:8px;opacity:.9}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ar.js@3.3.2/aframe/build/aframe-ar-nft.min.js"></script>
  <script src="/app.js"></script>
</head>
<body>
  <button id="startAR">Start AR</button>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    arjs="sourceType: webcam; facingMode: environment; trackingMethod: best; debugUIEnabled: false; start: false"
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <img id="mapTex" src="public/assets/asia-map.png" crossorigin="anonymous"/>
    </a-assets>

    <a-nft
    type="nft"
    url="public/assets/asia-map"
    smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5"
    emitevents="true"
    hotspots-loader-arjs="src: public/data/asia-stats.json">
    </a-nft>

    <a-entity camera
      look-controls="enabled: false"
      wasd-controls="enabled: false">
    </a-entity>

  </a-scene>

  <script>
  const startBtn = document.getElementById('startAR');
  const scene = document.querySelector('a-scene');

  async function requestCameraPermission() {
    // Try rear camera first, then fallback gracefully
    const constraints = { video: { facingMode: { ideal: 'environment' } }, audio: false };
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia(constraints);
      // Close the temporary stream immediately — we only needed the permission grant
      stream.getTracks().forEach(t => t.stop());
      return true;
    } catch (err) {
      console.error('getUserMedia error:', err);
      alert('Camera permission is required to start AR. Please allow camera access.');
      return false;
    }
  }

  startBtn.addEventListener('click', async () => {
    const ok = await requestCameraPermission();
    if (ok) {
      // Start AR.js (requests its own stream now that permission is granted)
      scene.systems['arjs'].start();
      startBtn.style.display = 'none';
    }
  });
  </script>

</body>
</html>

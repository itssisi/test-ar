<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <title>AR.js Map Stats (NFT)</title>
  <style>body,html{margin:0;padding:0;background:#000;overflow:hidden} .hint{position:fixed;left:12px;bottom:12px;color:#fff;font:14px/1.35 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;background:rgba(0,0,0,.35);padding:8px 10px;border-radius:8px;opacity:.9}</style>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ar.js@3.3.2/aframe/build/aframe-ar-nft.min.js"></script>
  <script src="./app.js"></script>
</head>
<body>
  <a-scene
    embedded
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;">
    
    <a-assets>
      <img id="mapTex" src="./assets/asia-map.png" crossorigin="anonymous"/>
    </a-assets>

    <!-- NFT anchor: requires asia-map.fset/.fset3/.iset beside url path -->
    <a-nft
      type="nft"
      url="./assets/asia-map"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
      hotspots-loader-arjs="src: ./data/asia-stats.json">
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <div class="hint">
    Point your camera at the Asia map.<br/>
    Place <code>asia-map.fset</code>, <code>asia-map.fset3</code>, <code>asia-map.iset</code> in <code>/assets</code> (generated from the same image). 
  </div>
</body>
</html>
